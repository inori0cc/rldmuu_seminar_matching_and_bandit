[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucb-corruption"
version = "0.1.0"
description = "Known-C Robust GS-UCB experiment for matching markets under per-player adversarial corruption."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "inori0cc", email = "guodongma00@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
